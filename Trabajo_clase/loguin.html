<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
    /* Estilos generales del cuerpo y fondo */
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  font-family: 'Segoe UI', Roboto, sans-serif;
  padding: 20px;
}

/* Contenedor del formulario */
form {
  background: #ffffff;
  padding: 2.5rem;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  width: 100%;
  max-width: 420px;
}

/* Espaciado entre elementos */
.mb-4 {
  margin-bottom: 1.5rem !important;
}

/* Estilos de los campos de entrada */
.form-outline {
  position: relative;
}

.form-control {
  width: 100%;
  padding: 0.85rem 1rem;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  font-size: 1rem;
  transition: all 0.3s ease;
  outline: none;
  background: transparent;
}

.form-control:focus {
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
}

/* Etiquetas */
.form-label {
  position: absolute;
  left: 1rem;
  top: 0.85rem;
  color: #94a3b8;
  pointer-events: none;
  transition: all 0.25s ease;
  background: white;
  padding: 0 0.3rem;
}

.form-control:focus + .form-label,
.form-control:not(:placeholder-shown) + .form-label {
  top: -0.6rem;
  left: 0.8rem;
  font-size: 0.8rem;
  color: #667eea;
}

/* Fila y columnas */
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.col {
  flex: 1;
}

/* Checkbox */
.form-check {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
}

.form-check-input {
  accent-color: #667eea;
  width: 1rem;
  height: 1rem;
  cursor: pointer;
}

.form-check-label {
  color: #475569;
  font-size: 0.95rem;
}

/* Enlace */
a {
  color: #667eea;
  text-decoration: none;
  font-size: 0.95rem;
  transition: color 0.2s;
}

a:hover {
  color: #764ba2;
  text-decoration: underline;
}

/* Botón */
.btn {
  width: 100%;
  padding: 0.9rem;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
}

.btn-primary:active {
  transform: translateY(0);
}

/* Iconos de redes sociales */
.social-icons {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-top: 1.5rem;
}

.social-icons a {
  font-size: 1.8rem;
  transition: transform 0.3s ease;
}

.social-icons a:hover {
  transform: scale(1.2);
}

.fa-facebook {
  color: #1877f2;
}

.fa-instagram {
  color: #e1306c;
}
    </style>
</head>
<body>
     <form id="loginForm" action="login.php" method="POST" novalidate>
   <form>
    <!-- Imagen arriba del formulario -->
<div class="imagen">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnPBLcI3-xGNdK0m8bFJZHSfOoyTR31UcCFek8QlKTjg&s=10" alt="Imagen" width="140" height="140">
</div>

  <!-- Email input -->
  <div data-mdb-input-init class="form-outline mb-4">
    <input type="email" id="form1Example1" class="form-control" />
    <label class="form-label" for="form1Example1">dirección de correo electrónico</label>
  </div>

  <!-- Contraseña input -->
  <div data-mdb-input-init class="form-outline mb-4">
    <input type="Contraseña" id="form1Example2" class="form-control" />
    <label class="form-label" for="form1Example2">Contraseña</label>
  </div>

  <!-- 2 column grid layout for inline styling -->
  <div class="row mb-4">
    <div class="col d-flex justify-content-center">
      <!-- Checkbox -->
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="form1Example3" checked />
        <label class="form-check-label" for="form1Example3"> Acuérdate</label>
      </div>
    </div>

    <div class="col">
      <!-- Simple link -->
      <a href="#!">¿Has olvidado tu contraseña?</a>
    </div>
  </div>

  <!-- Submit button -->
  <button data-mdb-ripple-init type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>

  <!-- Iconos de Facebook e Instagram -->
  <div class="social-icons">
    <a href="#!" target="_blank"><i class="fa-brands fa-facebook"></i></a>
    <a href="#!" target="_blank"><i class="fa-brands fa-instagram"></i></a>
  </div>
</form>

</body>
</html>
